<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: transparent; overflow: hidden; user-select: none; height: 100vh; }
  body { font-family: 'Segoe UI', sans-serif; padding: 8px; display: flex; flex-direction: column; gap: 6px; }

  /* ── Theme variable sets ─────────────────────────────────────────────── */
  body.theme-default {
    --bg: rgba(10,10,20,0.85); --border: rgba(255,255,255,0.10);
    --text: rgba(255,255,255,0.80); --dim: rgba(255,255,255,0.35);
    --label: rgba(255,255,255,0.30); --accent: #4fc; --bad-text: #f64;
    --empty: rgba(255,255,255,0.25); --nomatch: rgba(255,80,80,0.7);
    --timer-idle: rgba(255,255,255,0.20);
  }
  body.theme-high-contrast {
    --bg: rgba(0,0,0,0.95); --border: rgba(255,255,255,0.35);
    --text: #ffffff; --dim: rgba(255,255,255,0.65);
    --label: rgba(255,255,255,0.60); --accent: #00eaff; --bad-text: #ff3333;
    --empty: rgba(255,255,255,0.45); --nomatch: #ff5555;
    --timer-idle: rgba(255,255,255,0.40);
  }
  body.theme-colorblind-friendly {
    --bg: rgba(10,10,20,0.85); --border: rgba(255,255,255,0.10);
    --text: rgba(255,255,255,0.80); --dim: rgba(255,255,255,0.35);
    --label: rgba(255,255,255,0.30); --accent: #4fc; --bad-text: #ff9900;
    --empty: rgba(255,255,255,0.25); --nomatch: #ff9900;
    --timer-idle: rgba(255,255,255,0.20);
  }
  body.theme-minimal {
    --bg: rgba(10,10,20,0.45); --border: rgba(255,255,255,0.05);
    --text: rgba(255,255,255,0.65); --dim: rgba(255,255,255,0.25);
    --label: rgba(255,255,255,0.20); --accent: #8fd; --bad-text: #c66;
    --empty: rgba(255,255,255,0.15); --nomatch: #c66;
    --timer-idle: rgba(255,255,255,0.15);
  }

  .panel {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 12px;
    backdrop-filter: blur(4px);
  }

  .sec-label {
    font-size: 9px; text-transform: uppercase; letter-spacing: 0.7px;
    color: var(--label); margin-bottom: 6px;
  }

  /* Timers */
  .timer-grid { display: flex; gap: 4px; justify-content: space-between; }
  .timer-cell { text-align: center; flex: 1; }
  .t-label { display: block; font-size: 9px; color: var(--dim);
             text-transform: uppercase; letter-spacing: 0.4px; margin-bottom: 2px; }
  .t-value { font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums;
             color: var(--timer-idle); }
  .t-value.running  { color: var(--accent); }
  .t-value.ended    { color: var(--bad-text); }
  .t-value.overtime { color: var(--bad-text); }

  /* Evidence icons */
  .evi-grid { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
  .evi-item {
    display: flex; flex-direction: column; align-items: center; gap: 2px;
    opacity: 0.45; transition: opacity 0.15s;
  }
  .evi-item img { width: 26px; height: 26px; filter: brightness(0) invert(1); }

  /* good (confirmed present) — default: green */
  .evi-item.good { opacity: 1.0; }
  .evi-item.good img {
    filter: brightness(0) saturate(100%) invert(80%) sepia(80%)
            saturate(400%) hue-rotate(100deg) brightness(1.1);
  }

  /* bad (confirmed absent) — default: dim red */
  .evi-item.bad { opacity: 0.55; }
  .evi-item.bad img {
    filter: brightness(0) saturate(100%) invert(30%) sepia(90%)
            saturate(2000%) hue-rotate(340deg) brightness(0.9);
  }
  .evi-key { font-size: 8px; color: var(--label); }

  .evi-item { cursor: pointer; }
  .evi-item:hover { opacity: 0.75; }
  .evi-item.good:hover, .evi-item.bad:hover { opacity: 0.85; }

  /* Theme overrides for good/bad icon tint — colorblind-friendly swaps
     green/red for blue/orange; high-contrast and minimal adjust intensity. */
  body.theme-high-contrast .evi-item.good img {
    filter: brightness(0) saturate(100%) invert(90%) sepia(90%) saturate(800%) hue-rotate(95deg) brightness(1.4);
  }
  body.theme-high-contrast .evi-item.bad img {
    filter: brightness(0) saturate(100%) invert(40%) sepia(100%) saturate(3000%) hue-rotate(345deg) brightness(1.2);
  }
  body.theme-colorblind-friendly .evi-item.good img {
    filter: brightness(0) saturate(100%) invert(50%) sepia(90%) saturate(600%) hue-rotate(180deg) brightness(1.1);
  }
  body.theme-colorblind-friendly .evi-item.bad img {
    filter: brightness(0) saturate(100%) invert(60%) sepia(85%) saturate(900%) hue-rotate(0deg) brightness(1.3);
  }
  body.theme-minimal .evi-item.good img {
    filter: brightness(0) saturate(100%) invert(75%) sepia(30%) saturate(150%) hue-rotate(100deg) brightness(0.9);
  }
  body.theme-minimal .evi-item.bad img {
    filter: brightness(0) saturate(100%) invert(40%) sepia(40%) saturate(500%) hue-rotate(340deg) brightness(0.7);
  }

  /* Ghost list */
  .ghost-list { display: flex; flex-direction: column; gap: 2px; }
  .ghost { font-size: 12px; color: var(--text); padding: 1px 0; }
  .ghost.empty { color: var(--empty); font-size: 11px; font-style: italic; }
  .ghost.no-match { color: var(--nomatch); font-style: italic; font-size: 11px; }
</style>
</head>
<body class="theme-default">

<!-- Timers -->
<div class="panel" data-panel="timers">
  <div class="sec-label">Timers</div>
  <div class="timer-grid">
    <div class="timer-cell">
      <span class="t-label">Smudge</span>
      <div class="t-value" id="t-smudge">—</div>
    </div>
    <div class="timer-cell">
      <span class="t-label">Cooldown</span>
      <div class="t-value" id="t-cooldown">—</div>
    </div>
    <div class="timer-cell">
      <span class="t-label">Hunt</span>
      <div class="t-value" id="t-hunt">—</div>
    </div>
  </div>
</div>

<!-- Evidence -->
<div class="panel" data-panel="evidence">
  <div class="sec-label">Evidence</div>
  <div class="evi-grid">
    <div class="evi-item" data-evi="EMF 5" data-idx="0">
      <img src="../../imgs/emf5-icon.png" alt="EMF 5">
      <span class="evi-key">^1</span>
    </div>
    <div class="evi-item" data-evi="Ultraviolet" data-idx="1">
      <img src="../../imgs/fingerprints-icon.png" alt="UV">
      <span class="evi-key">^2</span>
    </div>
    <div class="evi-item" data-evi="Writing" data-idx="2">
      <img src="../../imgs/writing-icon.png" alt="Writing">
      <span class="evi-key">^3</span>
    </div>
    <div class="evi-item" data-evi="Ghost Orbs" data-idx="3">
      <img src="../../imgs/orbs-icon.png" alt="Orbs">
      <span class="evi-key">^4</span>
    </div>
    <div class="evi-item" data-evi="Spirit Box" data-idx="4">
      <img src="../../imgs/spirit-box-icon.png" alt="Spirit Box">
      <span class="evi-key">^5</span>
    </div>
    <div class="evi-item" data-evi="Freezing" data-idx="5">
      <img src="../../imgs/freezing-icon.png" alt="Freezing">
      <span class="evi-key">^6</span>
    </div>
    <div class="evi-item" data-evi="DOTs" data-idx="6">
      <img src="../../imgs/dots-icon.png" alt="DOTS">
      <span class="evi-key">^7</span>
    </div>
  </div>
</div>

<!-- Ghost list -->
<div class="panel" data-panel="ghosts">
  <div class="sec-label">Possible Ghosts</div>
  <div class="ghost-list" id="ghost-list">
    <div class="ghost empty">No evidence selected</div>
  </div>
</div>

<script>
  // ── Timer display ──────────────────────────────────────────────────────────
  function setTimer(id, value, running, overtime) {
    const el = document.getElementById('t-' + id);
    if (!el) return;
    el.textContent = value || '—';
    el.className = 't-value' + (overtime ? ' overtime' : running ? ' running' : (value === '0:00' ? ' ended' : ''));
  }

  // ── Evidence display ───────────────────────────────────────────────────────
  function setEvidence(evidence) {
    document.querySelectorAll('.evi-item').forEach(el => {
      const val = (evidence && evidence[el.dataset.evi]) || 0;
      el.classList.toggle('good', val === 1);
      el.classList.toggle('bad', val === -1);
    });
  }

  // ── Ghost list display ─────────────────────────────────────────────────────
  function setGhostList(ghostList) {
    const list = document.getElementById('ghost-list');
    if (!ghostList || ghostList.length === 0) {
      list.innerHTML = '<div class="ghost no-match">No match</div>';
      return;
    }
    list.innerHTML = ghostList.slice(0, 12).map(g =>
      `<div class="ghost">${g}</div>`
    ).join('');
  }

  // ── Audio cues (synthetic tones via Web Audio API) ─────────────────────────
  let audioCtx = null;
  function getAudioCtx() {
    if (!audioCtx) audioCtx = new AudioContext();
    return audioCtx;
  }
  function playTone(freq, duration, type = 'sine') {
    try {
      const ctx = getAudioCtx();
      console.log('[audio] ctx.state =', ctx.state);
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.type = type;
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.3, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
      osc.start(ctx.currentTime);
      osc.stop(ctx.currentTime + duration);
    } catch (e) { console.error('[audio] playTone failed:', e.message); }
  }
  function playAudioFile(path) {
    try {
      const audio = new Audio(path);
      audio.volume = 0.8;
      audio.play().catch(e => console.error('[audio] file playback failed:', e.message));
    } catch (e) { console.error('[audio] file playback error:', e.message); }
  }
  function playVoiceLine(name) {
    playAudioFile(`../../lang-v10/en/assets/${name}.mp3`);
  }
  function handleAudio({ id, event, n }) {
    if (event === 'start')            playAudioFile('../../assets/start.mp3');  // timer started (all timers)
    if (event === 'stop')             playAudioFile('../../assets/stop.mp3');   // timer manually stopped
    if (event === 'warning')          playTone(880, 0.3);                // high beep at 10s (hunt only)
    if (event === 'ended')            playTone(220, 0.6, 'sawtooth');    // low buzz at 0s (hunt only)
    if (event === 'demon-cooldown')   playVoiceLine('demon_cooldown');   // replaces warning beep on cooldown
    if (event === 'standard-cooldown')playVoiceLine('standard_cooldown');// 5s before cooldown's true end
    if (event === 'spirit-warning')   playVoiceLine('spirit_smudge');    // 8s before smudge overtime ends
    if (event === 'standard-smudge')  playVoiceLine('standard_smudge');  // 8s before smudge's normal end
    if (event === 'countdown')        playVoiceLine(String(n));          // spoken 5,4,3,2,1
    if (event === 'finish')           playAudioFile('../../assets/finish.mp3'); // smudge/cooldown boundary ding
  }

  // ── Reset ──────────────────────────────────────────────────────────────────
  function resetDisplay() {
    ['smudge','cooldown','hunt'].forEach(id => setTimer(id, '—', false));
    setEvidence({});
    document.getElementById('ghost-list').innerHTML =
      '<div class="ghost empty">No evidence selected</div>';
  }

  // ── Overlay settings (theme / scale / panel visibility) ────────────────────
  function applySettings(settings) {
    if (!settings) return;
    document.body.className = 'theme-' + (settings.theme || 'default');
    document.body.style.zoom = settings.scale || 1;
    const panels = settings.panels || {};
    document.querySelectorAll('.panel[data-panel]').forEach(el => {
      const visible = panels[el.dataset.panel] !== false;
      el.style.display = visible ? '' : 'none';
    });
  }

  // ── Evidence panel: hover-driven interactivity + click-to-toggle ───────────
  if (window.overlayAPI) {
    const evidencePanel = document.querySelector('.evi-grid').closest('.panel');
    evidencePanel.addEventListener('mouseenter', () => window.overlayAPI.setInteractive(true));
    evidencePanel.addEventListener('mouseleave', () => window.overlayAPI.setInteractive(false));

    document.querySelectorAll('.evi-item').forEach(el => {
      el.addEventListener('click', () => {
        window.overlayAPI.toggleEvidence(parseInt(el.dataset.idx, 10));
      });
    });
  }

  // ── Wire IPC ──────────────────────────────────────────────────────────────
  console.log('[overlay] overlayAPI available:', !!window.overlayAPI);
  if (window.overlayAPI) {
    window.overlayAPI.onTimerUpdate(({ id, value, running, overtime }) => {
      console.log('[overlay] timer-update', id, value, running, overtime);
      setTimer(id, value, running, overtime);
    });
    window.overlayAPI.onEvidenceUpdate(({ evidence, ghostList }) => {
      console.log('[overlay] evidence-update', Object.keys(evidence || {}).length, 'keys');
      setEvidence(evidence);
      setGhostList(ghostList);
    });
    window.overlayAPI.onPlayAudio(handleAudio);
    window.overlayAPI.onResetAll(resetDisplay);
    window.overlayAPI.getSettings().then(applySettings).catch(e => console.error('[overlay] getSettings failed:', e.message));
    window.overlayAPI.onSettingsUpdate(applySettings);
  }
</script>
</body>
</html>
